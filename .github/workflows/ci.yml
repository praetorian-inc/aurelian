name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci*'
      - 'Makefile'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: praetorian-inc/public-workflows/.github/workflows/go-ci.yml@0c602372f3d0d038912dd08e159ecc83954a4995  # v2.9.3
    permissions:
      contents: read
    with:
      build-cmd-path: .
      build-binary-name: aurelian
      golangci-lint-version: v2.14.0
      golangci-lint-timeout: 10m
      test-flags: ${{ github.event_name == 'pull_request' && '-coverprofile=coverage.out' || '-race -coverprofile=coverage.out -covermode=atomic' }}
      build-matrix-os: ${{ github.event_name == 'pull_request' && '["linux"]' || '["linux","darwin","windows"]' }}
      build-matrix-arch: ${{ github.event_name == 'pull_request' && '["amd64"]' || '["amd64","arm64"]' }}
    secrets: inherit
